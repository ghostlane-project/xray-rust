[package]
name = "olc-ffi"
description = "The olcRTC client's API for the apps: OlcrtcRuntime (UniFFI), the call-for-call replacement of gomobile's mobile.Runtime at the engine pin 2d4266af"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
futures-util.workspace = true
ghostlane-runtime = { path = "../../crates/ghostlane-runtime" }
olc-client = { path = "../olc-client" }
# The signalling's TLS (`shaped_tls::install`), which a start puts in.
olc-net = { path = "../olc-net", features = ["shaped-tls"] }
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tokio-util = { version = "0.7.19", default-features = false }
# MPL-2.0 (deny.toml allows it); 0.32.2 of 2026-09-22.
uniffi = "=0.32.2"
webpki-roots.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The heap by allocation site (examples/olc-ffi-dhat.rs); MIT OR Apache-2.0.
dhat = "0.3.3"

[features]
# The bindings generator (`cargo run -p olc-ffi --features bindgen --bin
# uniffi-bindgen -- generate ...`), for the build hosts only.
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "olc-ffi-client"
path = "src/bin/olc-ffi-client/main.rs"
