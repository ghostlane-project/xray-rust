[package]
name = "olc-spike-probe"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "M2 spike probes: str0m against the engine's fake SFU, DTLS loopback, memory gauges"

[features]
default = []
# The BoringSSL DTLS provider (needs libclang and cmake to build: GitHub runners, not the box).
boring = ["dep:olc-spike-dtls-boring"]

[dependencies]
str0m.workspace = true
str0m-aws-lc-rs.workspace = true
is.workspace = true
tungstenite.workspace = true
serde_json.workspace = true
libc.workspace = true
olc-spike-dtls-boring = { path = "../dtls-boring", optional = true }

[[bin]]
name = "sfu-probe"
path = "src/bin/sfu-probe.rs"

[[bin]]
name = "loopback"
path = "src/bin/loopback.rs"

[[bin]]
name = "sdp-bridge"
path = "src/bin/sdp-bridge.rs"
