# The M2 stack spike (olcRTC client port, 20-port-plan.md section 11).
#
# Its own workspace, so nothing here touches the xray-rust workspace or its Cargo.lock:
#   probe/        the probes: sfu-probe (probe a), loopback (DTLS 1.3 through BoringSSL), the memory gauges
#   dtls-boring/  a str0m DtlsProvider on BoringSSL (`boring` 5.5), shaped like Chrome's DTLS
#   ios-link/     probe d: BoringSSL + aws-lc-rs + ring in one iOS binary
#   vendor/is-0.12.0/  str0m's ICE crate, forked for Chrome's STUN attribute order (StunProfile in src/stun.rs)
[workspace]
resolver = "2"
# The vendored `is` is a member so `cargo test -p is` runs its tests with the fork's.
members = ["probe", "dtls-boring", "ios-link", "vendor/is-0.12.0"]
default-members = ["probe"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
str0m = { version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }
str0m-proto = { version = "=0.8.0", default-features = false, features = ["dtls"] }
str0m-aws-lc-rs = "=0.7.0"
is = { version = "=0.12.0", default-features = false }
boring = "=5.5.0"
boring-sys = "=5.5.0"
foreign-types = "0.5"
tungstenite = "0.30"
serde_json = { version = "1", features = ["preserve_order"] }
libc = "0.2"

[patch.crates-io]
is = { path = "vendor/is-0.12.0" }

[profile.release]
debug = false
strip = "symbols"
lto = "thin"
codegen-units = 4
panic = "abort"
