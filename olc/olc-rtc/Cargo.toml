[package]
name = "olc-rtc"
description = "The olcRTC engines' WebRTC: one str0m peer connection per task on a protected socket, Chrome's ICE credentials and STUN order"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false

[dependencies]
is = { version = "=0.12.0", default-features = false }
olc-net = { path = "../olc-net" }
rand.workspace = true
str0m = { version = "=0.25.0", default-features = false, features = ["aws-lc-rs"] }
str0m-aws-lc-rs = "=0.7.0"
thiserror.workspace = true
tokio.workspace = true
turn-client-proto = { version = "=0.8.0", default-features = false, features = ["std"] }
# A TURN credential is wiped when its holder is dropped (turn.rs).
zeroize.workspace = true
# The `boring` feature: BoringSSL for the DTLS part (dtls_boring) and TURN
# over TLS's (tls_boring, whose certificate compression is brotli).
boring = { version = "=5.5.0", optional = true }
brotli-decompressor = { version = "=5.0.3", optional = true }
boring-sys = { version = "=5.5.0", optional = true }
foreign-types = { version = "0.5", optional = true }
libc = { workspace = true, optional = true }
# TURN over TLS's certificate check (turns_verify): rustls-webpki against
# webpki-roots' trust anchors, both already in the workspace's lock.
rustls-pki-types = { version = "=1.14.1", default-features = false, features = ["std"], optional = true }
rustls-webpki = { version = "=0.103.16", default-features = false, features = ["std", "aws-lc-rs"], optional = true }
webpki-roots = { workspace = true, optional = true }
str0m-proto = { version = "=0.8.0", default-features = false, features = ["dtls"], optional = true }

[features]
# DTLS from BoringSSL, configured as libwebrtc configures it, so the
# ClientHello and the certificate are Chrome's (port plan section 8, X2-X4);
# and the TLS of TURN over TLS, configured as Chrome's network stack's.
# Building it needs cmake and libclang, which the build box does not have:
# it is built and tested on a GitHub runner (ghostlane lab/olc-rtc).
boring = [
    "dep:boring", "dep:boring-sys", "dep:brotli-decompressor", "dep:foreign-types", "dep:libc", "dep:str0m-proto",
    "dep:rustls-pki-types", "dep:rustls-webpki", "dep:webpki-roots",
]
# A test build only: TURN over TLS trusts one more root, the PEM file the
# environment variable OLC_TURNS_TEST_ROOT names (the lab's end-to-end test
# has a TURN server of its own certificate). The shipped features never
# read it.
turns-test-roots = ["boring"]

[dev-dependencies]
# The Go engine's vectors (vkshape.rs holds its fixtures to them).
olc-interop = { path = "../interop/oracle-client" }
tokio = { workspace = true, features = ["test-util"] }
# An in-process TURN server for the relay tests (webrtc-rs; tests only).
turn = "=0.17.3"
webrtc-util = { version = "=0.17.3", default-features = false, features = ["conn", "vnet"] }
