name: Ghostlane p6

# Fork only (ghostlane-project/xray-rust). The program's branches (p6/**) have
# no other check: ci.yml and ghostlane-guards.yml run on pull requests, main
# and tags. This builds the host target of the crates the Ghostlane apps ship
# (ghostlane-core with the `boring` feature: xray-ffi and olc-ffi) on Linux,
# macOS and Windows and runs the tests scripts/ghostlane/p6-ci.sh names.
#
# The Windows leg does not build the shipped library: the olc crates use
# std::os::fd with no cfg, so it only checks, and reports per crate how many
# errors the compiler gave (job summary). `required` on its matrix entry
# moves two things together: continue-on-error and P6_WINDOWS_REQUIRED. While it
# is false the Windows job cannot fail the run; set it true once the crates build.
#
# Upstream's ci.yml runs at the pin from the app's driver; this file is not
# part of that.
on:
  push:
    branches: ["p6/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghostlane-p6-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  host:
    name: host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.windows && !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            windows: false
          - os: macos-15
            windows: false
          - os: windows-2025
            windows: true
            required: false
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt
          rustup default 1.96.0

      - name: Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: p6-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            p6-${{ matrix.os }}-

      - name: Script self-test
        shell: bash
        run: bash scripts/ghostlane/p6-ci.sh selftest

      - name: Build and test the host target
        if: ${{ !matrix.windows }}
        shell: bash
        run: bash scripts/ghostlane/p6-ci.sh host

      - name: Windows check, errors per crate
        if: ${{ matrix.windows }}
        shell: bash
        env:
          P6_WINDOWS_REQUIRED: ${{ matrix.required && '1' || '0' }}
        run: bash scripts/ghostlane/p6-ci.sh windows-report
