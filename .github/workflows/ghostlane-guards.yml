name: Ghostlane guards

# Fork only (ghostlane-project/xray-rust): the memory checks the Ghostlane
# iPhone packet tunnel needs (memory model 05, T1 and T9). The extension is
# killed at about 50 MB, so a future, a type or the UDP association heap that
# regrows fails here.
#
# They live apart from ci.yml on purpose. Upstream's
# scripts/tests/check-scheduled-interop-workflow.test.sh, run by ci.yml's own
# "Check repository scripts" step, holds ci.yml's header, its job list and its
# rust job line for line to upstream's reviewed canonical policy, so a step
# added to that job fails upstream's check (Ghostlane's "Rust core" run
# 43658629134 at 4a081163). ci.yml stays byte for byte as upstream wrote it,
# and upstream's changes to it merge in without conflicts.
#
# Triggered as ci.yml is, and the job runs when ci.yml's rust job runs (the
# same tag-push condition). Neither workflow runs on the fork's own branches:
# Ghostlane's "Rust core" workflow (ghostlane-project/ghostlane,
# .github/workflows/rust-core.yml) runs this file's job at the pin through
# its scripts/rust-core-upstream-ci.py, as it runs ci.yml's jobs. That driver
# runs `run` steps and the checkout, and refuses any other action or a `${{ }}`
# expression in the job or its steps: keep the job inside that.
#
# The toolchain is the rust job's (1.96.0, rust-toolchain.toml): when upstream
# moves it in ci.yml, move it here too.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ghostlane-guards-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  memory-guards:
    if: github.event_name != 'push' || github.ref_type != 'tag' || contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component clippy,rustfmt

      - name: Select pinned Rust toolchain
        run: rustup default 1.96.0

      - name: Size lints on the app's code
        # Memory model 05, T9. The thresholds are in
        # .ghostlane/clippy/clippy.toml, read through CLIPPY_CONF_DIR, so
        # upstream's Lint step in ci.yml is unchanged. Library and binary
        # targets only (test, bench and example code is off the tunnel's paths)
        # and the default features: the `fuzzing` drivers that `--all-features`
        # compiles into the libraries are not shipped.
        env:
          CLIPPY_CONF_DIR: .ghostlane/clippy
        run: >
          cargo clippy --locked --lib --bins
          -p xray-config -p xray-utls -p xray-routing -p xray-tun -p xray-proxy
          -p xray-vless-encryption -p xray-transport -p xray-wireguard
          -p xray-runtime -p xray-core-rs -p xray-ffi
          -- -D clippy::large_futures -D clippy::large_stack_arrays
          -D clippy::large_types_passed_by_value

      - name: Memory size guards (release)
        # Future and type sizes and the UDP association heap are release-profile
        # numbers (debug builds `ignore` these tests). The Ghostlane packet
        # tunnel is killed at about 50 MB: a size that regrows fails here
        # (memory model 05, T1).
        run: |
          cargo test --release --locked -p xray-core-rs --lib size_tests
          cargo test --release --locked -p xray-transport --test size_guards
          cargo test --release --locked -p xray-core-rs --test udp_association_memory
