name: tls-send-lab

# Lab for gl/tls-send-limit: T4 (relay_memory_tests) on a GitHub ubuntu-24.04
# runner, built as the rust job's Test step builds it (debug, the whole
# workspace's features), T4 alone, 10 times with two core workers and 10 with one (lab-11). Throwaway
# gl/tls-send-lab-* branches only; never merged.

on:
  push:
    branches: ['gl/tls-send-lab-*']

permissions:
  contents: read

concurrency:
  group: tls-send-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never

jobs:
  t4:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner
        run: |
          nproc; grep -m1 'model name' /proc/cpuinfo; free -m; uname -r
      - name: Toolchain
        run: rustup toolchain install 1.96.0 --profile minimal && rustup default 1.96.0
      - name: Build as the Test step does
        run: |
          set -euo pipefail
          cargo test --workspace --exclude xray-rust-fuzz --all-targets --locked --no-run --message-format=json > "$RUNNER_TEMP/build.json"
          bin=$(python3 -c 'import json,sys; print(next(v["executable"] for v in map(json.loads, open(sys.argv[1])) if v.get("reason") == "compiler-artifact" and v.get("executable") and v["target"]["name"] == "relay_memory_tests"))' "$RUNNER_TEMP/build.json")
          echo "BIN=$bin" >> "$GITHUB_ENV"; echo "$bin"
      - name: T4 x 10, two core workers, then x 10, one
        working-directory: crates/xray-core-rs
        run: |
          set +e -uo pipefail
          for workers in 2 1; do
            pass=0 fail=0
            for i in $(seq 1 10); do
              out=$(LAB_CORE_WORKERS=$workers timeout 600 "$BIN" --nocapture --test-threads=1 sixty_four_vision_flows 2>&1); rc=$?
              echo "workers=$workers run $i rc=$rc $(printf '%s\n' "$out" | grep -E '^test result:' | tail -1)"
              printf '%s\n' "$out" | grep -E '^T4 |^LAB |panicked|the uploads held|the flows held|without a limit' | sed 's/^/    /'
              if [ $rc -eq 0 ]; then pass=$((pass+1)); else fail=$((fail+1)); fi
            done
            echo "workers=$workers pass=$pass fail=$fail"
          done
