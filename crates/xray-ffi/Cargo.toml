[package]
name = "xray-ffi"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Stable C ABI for embedding xray-rust in Apple and Android clients"

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
bytes.workspace = true
libc.workspace = true
serde_json.workspace = true
tokio.workspace = true
xray-config = { path = "../xray-config" }
xray-core-rs = { path = "../xray-core-rs" }
xray-routing = { path = "../xray-routing" }
xray-tun = { path = "../xray-tun" }
xray-transport = { path = "../xray-transport" }
zeroize.workspace = true
# The phone's keep-alive (`runtime::PHONE_KEEP_ALIVE`) for the core's own
# runtime, and with `shared-runtime` the runtime itself. xray-transport
# depends on it already (the byte budget), so it adds no crate.
ghostlane-runtime = { path = "../ghostlane-runtime" }

[features]
# The core runs on the process's one runtime (`ghostlane-runtime`), which
# ghostlane-core shares with the olcRTC client, instead of building its own.
shared-runtime = []
