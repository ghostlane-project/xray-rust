[package]
name = "ghostlane-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Ghostlane's one program for the desktops and the command line: a core line, or a room with a core in front of it, run from a session file, with JSON-line events on stdout"
build = "build.rs"

[[bin]]
name = "ghostlane-engine"
path = "src/main.rs"

[dependencies]
# The process's one Tokio runtime and the counting allocator, shared with the
# olcRTC client when the rooms are built. xray-transport depends on it already.
ghostlane-runtime = { path = "../ghostlane-runtime" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
xray-config = { path = "../xray-config" }
xray-core-rs = { path = "../xray-core-rs" }
xray-transport = { path = "../xray-transport" }
# The rooms: the olcRTC client behind its app API, and the name of the DTLS
# the build carries (`version`).
olc-ffi = { path = "../../olc/olc-ffi", optional = true }
# The room's sockets are protected through olc-net's peer-aware setter, so
# the escape can leave a loopback peer unbound (olc-ffi's setter drops it).
olc-net = { path = "../../olc/olc-net", optional = true }
olc-rtc = { path = "../../olc/olc-rtc", optional = true }

[target.'cfg(unix)'.dependencies]
# The file limit at start, and the socket options of the ways out
# (escape_linux.rs, escape_macos.rs).
libc.workspace = true

[features]
default = ["rooms"]
# The room half of a session and the room one-shots. Off, no olc crate is
# built: the olc crates do not compile for Windows yet, and the engine without
# rooms is what a Windows build gets first.
rooms = ["dep:olc-ffi", "dep:olc-net", "dep:olc-rtc"]
# The rooms' DTLS from BoringSSL (olc-ffi's `boring`); the shipped engine is
# built with it. Needs cmake and libclang.
boring = ["rooms", "olc-ffi/boring"]
